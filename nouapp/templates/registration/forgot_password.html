{% extends 'parent.html' %}
{% load static %}
{% block body %}
<!-- Start Of Forgot Password Form -->
<div class="row mt-2">
  <div class="col-12 d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 140px);">
    <form
      action="{% url 'nouapp:forgot_password' %}"
      id="frmForgotPassword"
      method="post"
      onsubmit="event.preventDefault(); validateForgotPassword();"
    >
      {% csrf_token %}
      <div
        class="forgot-container"
        style="
          background-color: var(--card-bg);
          width: 400px;
          max-width: 90%;
          box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.6);
          border-radius: 10px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
          padding: 30px 20px;
        "
      >
        {% if messages %}
          {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            <strong>{{ message }}</strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          {% endfor %}
        {% endif %}

        <h1 class="form-heading" style="
          color: var(--primary-color) !important;
          font-family: Poppins, sans-serif;
          font-weight: bold;
          margin-bottom: 20px;
          text-align: center;
          width: 100%;
        ">
          <b>FORGOT PASSWORD</b>
        </h1>

        <hr style="width: 100%; border-color: var(--primary-color); opacity: 0.3; margin-bottom: 20px;" />

        <p style="text-align: center; color: var(--card-text); margin-bottom: 15px;">
          Enter your registered email address to receive a password reset link.
        </p>

        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your email"
          required
          style="
            box-shadow: 0px 0px 3px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            height: 40px;
            width: 100%;
            margin-bottom: 15px;
            border: none;
            padding: 6px 10px;
            background-color: var(--card-bg);
            color: var(--card-text);
          "
        />

        <button
          type="submit"
          class="btn btn-primary"
          style="
            width: 100%;
            height: 40px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border: none;
          "
        >
          Send Reset Link
        </button>

        <p style="font-size: 14px; text-align: center; margin: 0; color: var(--card-text);">
          <a href="{% url 'nouapp:login' %}" style="color: var(--accent-color);">
            <u>Back to Login</u>
          </a>
        </p>
      </div>
    </form>
  </div>
</div>
<!-- End Of Forgot Password Form -->

<script>
  function validateForgotPassword() {
    var email = document.getElementById("email");
    if (!email.value) {
      alert("Please enter your email");
      email.focus();
    } else if (!/^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/.test(email.value)) {
      alert("Please enter a valid email address");
      email.focus();
    } else {
      document.getElementById("frmForgotPassword").submit();
    }
  }
</script>

<!-- Responsive styles -->
<style>
  @media (max-width: 768px) {
    .forgot-container {
      width: 90% !important;
      margin: 20px auto !important;
      padding: 10px !important;
    }
    .forgot-container input,
    .forgot-container button {
      width: 100% !important;
      display: block;
    }
    .forgot-container h1 {
      text-align: center !important;
    }
  }

  @media (max-width: 480px) {
    .forgot-container {
      margin-top: 20px !important;
      padding: 10px !important;
    }
    .forgot-container h1 {
      font-size: 1.5rem !important;
    }
  }
</style>
{% endblock body %}
