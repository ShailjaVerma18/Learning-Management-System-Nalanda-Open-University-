{% extends 'parent.html' %}
{% block body %}
<div class="row mt-2">
  <div class="col-12 d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 140px);">
    <div style="width:400px; max-width:90%; background-color: var(--card-bg); padding:30px 20px; border-radius:10px; box-shadow:0 5px 10px rgba(0,0,0,0.6); text-align:center;">
      <h2 style="color: var(--primary-color); margin-bottom:20px;">Password Reset Successful!</h2>
      <p>Your password has been updated. You can now login with your new password.</p>
      <p style="margin-top:15px;">
        <a href="{% url 'login' %}" style="color: var(--accent-color);"><u>Back to Login</u></a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
