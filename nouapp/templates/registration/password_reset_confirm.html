{% extends 'parent.html' %}
{% block body %}
<div class="row mt-2">
  <div class="col-12 d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 140px);">
    <form method="post" style="width:400px; max-width:90%; background-color: var(--card-bg); padding:30px 20px; border-radius:10px; box-shadow:0 5px 10px rgba(0,0,0,0.6);">
      {% csrf_token %}
      <h1 style="text-align:center; color: var(--primary-color); margin-bottom:20px;">Reset Password</h1>
      <hr style="width:100%; border-color: var(--primary-color); opacity:0.3; margin-bottom:20px;">

      {% if validlink %}
        <input type="password" name="new_password1" placeholder="New Password" required style="width:100%; margin-bottom:15px; padding:6px 10px; border:none; border-radius:5px; background-color: var(--card-bg); color: var(--card-text);">
        <input type="password" name="new_password2" placeholder="Confirm Password" required style="width:100%; margin-bottom:15px; padding:6px 10px; border:none; border-radius:5px; background-color: var(--card-bg); color: var(--card-text);">
        <button type="submit" class="btn btn-primary" style="width:100%; background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); border:none; height:40px;">Reset Password</button>
      {% else %}
        <p style="text-align:center; color:red;">Invalid or expired link.</p>
        <p style="text-align:center; margin-top:10px;"><a href="{% url 'password_reset' %}" style="color: var(--accent-color);"><u>Try again</u></a></p>
      {% endif %}
    </form>
  </div>
</div>
{% endblock %}
