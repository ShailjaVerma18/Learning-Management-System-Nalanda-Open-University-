{% extends 'parent.html' %}
{% load static %}
{% block body %}
<div class="row mt-2">
  <div class="col-12 d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 140px);">
    <form action="" method="post" style="width: 400px; max-width: 90%; background-color: var(--card-bg); padding: 30px 20px; border-radius: 10px; box-shadow: 0px 5px 10px rgba(0,0,0,0.6);">
      {% csrf_token %}
      <h1 style="text-align:center; color: var(--primary-color); margin-bottom:20px;">Forgot Password</h1>
      <hr style="width:100%; border-color: var(--primary-color); opacity:0.3; margin-bottom:20px;">
      
      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
      {% endif %}
      
      <input type="email" name="email" placeholder="Enter your email" style="width:100%; margin-bottom:15px; padding:6px 10px; border:none; border-radius:5px; background-color: var(--card-bg); color: var(--card-text);" required>
      
      <button type="submit" class="btn btn-primary" style="width:100%; background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); border:none; height:40px;">Send Reset Link</button>
      
      <p style="text-align:center; margin-top:15px; font-size:14px;">
        <a href="{% url 'login' %}" style="color: var(--accent-color);"><u>Back to Login</u></a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
